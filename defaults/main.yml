stigforge_role: ol10_stig
stigforge_profile: stig
stigforge_rules_enabled: true
stigforge_min_score: 90
stigforge_ssg_datastream: ssg-ol10-ds.xml
stigforge_ssg_profile: xccdf_org.ssgproject.content_profile_stig
var_aide_scan_notification_email: root@localhost
var_system_crypto_policy: FIPS
sshd_approved_macs: hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
inactivity_timeout_value: '900'
var_screensaver_lock_delay: '5'
var_sudo_timestamp_timeout: '0'
login_banner_contents: You are accessing a U.S. Government (USG) Information System (IS) that is\nprovided for USG-authorized
  use only. By using this IS (which includes any\ndevice attached to this IS), you consent to the following conditions:\n\n-The
  USG routinely intercepts and monitors communications on this IS for\npurposes including, but not limited to, penetration
  testing, COMSEC monitoring,\nnetwork operations and defense, personnel misconduct (PM), law enforcement\n(LE), and counterintelligence
  (CI) investigations.\n\n-At any time, the USG may inspect and seize data stored on this IS.\n\n-Communications using, or
  data stored on, this IS are not private, are subject\nto routine monitoring, interception, and search, and may be disclosed
  or used\nfor any USG-authorized purpose.\n\n-This IS includes security measures (e.g., authentication and access controls)\nto
  protect USG interests--not for your personal benefit or privacy.\n\n-Notwithstanding the above, using this IS does not constitute
  consent to PM, LE\nor CI investigative searching or monitoring of the content of privileged\ncommunications, or work product,
  related to personal representation or services\nby attorneys, psychotherapists, or clergy, and their assistants. Such\ncommunications
  and work product are private and confidential. See User\nAgreement for details.
dconf_login_banner_contents: Authorized users only. All activity may be monitored and reported.
var_accounts_passwords_pam_faillock_deny: '3'
var_accounts_passwords_pam_faillock_dir: /var/log/faillock
var_accounts_passwords_pam_faillock_fail_interval: '900'
var_accounts_passwords_pam_faillock_unlock_time: '0'
var_password_pam_dcredit: '-1'
var_password_pam_dictcheck: '1'
var_password_pam_difok: '8'
var_password_pam_lcredit: '-1'
var_password_pam_maxclassrepeat: '4'
var_password_pam_maxrepeat: '3'
var_password_pam_minclass: '4'
var_password_pam_minlen: '15'
var_password_pam_ocredit: '-1'
var_password_pam_retry: '3'
var_password_pam_ucredit: '-1'
var_password_hashing_algorithm_pam: sha512
var_password_hashing_algorithm: SHA512
var_password_hashing_min_rounds_login_defs: '5000'
var_logind_session_timeout: '300'
var_smartcard_drivers: cac
var_account_disable_post_pw_expiration: '35'
var_accounts_maximum_age_login_defs: '60'
var_accounts_minimum_age_login_defs: '1'
var_password_pam_unix_rounds: '100000'
var_accounts_fail_delay: '4'
var_accounts_max_concurrent_login_sessions: '10'
var_accounts_tmout: '900'
var_user_initialization_files_regex: ^\.[\w\- ]+$
var_accounts_user_umask: '077'
rsyslog_remote_loghost_address: logcollector
